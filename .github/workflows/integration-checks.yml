name: integration-checks

# D2（Issue #12 / D-F3）：组合启动与集成检查入口。
# 挂法 B：只手动触发 + 每天定时，不进 PR 门禁。现在会红是因为 Java/MySQL 尚未落地，
# 缺服务不该反过来挡住别人的 PR；等各模块到位后再提为必过。
# 判定语义：任一必需服务缺失、步骤不是 PASS，job 就失败；不允许 SKIP 算通过。

on:
  workflow_dispatch:
  schedule:
    - cron: "30 1 * * *"

permissions:
  contents: read

concurrency:
  group: integration-checks-${{ github.ref }}
  cancel-in-progress: false

jobs:
  stack-integration:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: ci-root-not-a-secret
          MYSQL_DATABASE: coursepilot
          MYSQL_USER: coursepilot
          MYSQL_PASSWORD: ci-password-not-a-secret
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    env:
      # 仅用于让统一配置入口通过校验、让判定可比；不是任何真实密钥（真实值只放本机 data/private/stack.env）。
      CP_MYSQL_HOST: 127.0.0.1
      CP_MYSQL_PORT: "3306"
      CP_MYSQL_DB: coursepilot
      CP_MYSQL_USER: coursepilot
      CP_MYSQL_PASSWORD: ci-password-not-a-secret
      CP_SERVICE_KEY: ci-service-key-not-a-secret
      CP_JAVA_BASE_URL: http://127.0.0.1:8080
      CP_API_BASE_URL: http://127.0.0.1:8000
      CP_WEB_BASE_URL: http://127.0.0.1:5173
      CP_CORS_ORIGINS: http://127.0.0.1:5173
      CP_MODEL_BASE_URL: ""
      CP_MODEL_API_KEY: ""
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: 安装集成模块与唯一 Runner
        run: |
          python -m pip install -r requirements-dev.txt
          python -m pip install -e "./integration[test]"
          python -m pip install -e "./agent-runtime[test]"

      - name: 安装页面依赖
        working-directory: web
        run: npm ci

      - name: 安装真浏览器（headless chromium）
        id: browser
        continue-on-error: true
        run: |
          python -m pip install playwright
          python -m playwright install --with-deps chromium

      - name: 全链路检查（配置校验 → 组合启动 → 主链路 → 异常覆盖 → 浏览器）
        id: stack
        continue-on-error: true
        run: python integration/check_all.py --driver playwright

      - name: 浏览器检查（受控上游：页面能否进入引导第一问）
        id: web-stub
        continue-on-error: true
        run: |
          python integration/start_stack.py --only web --keep || true
          code=0
          python integration/check_web.py --driver playwright --with-stub || code=$?
          python integration/start_stack.py --stop || true
          exit $code

      - name: 证据留存（五段式失败块、服务日志与截图）
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: stack-evidence
          path: runs/stack/
          if-no-files-found: warn

      - name: 门禁：任一检查未通过即失败
        if: always()
        run: |
          failed=""
          for pair in "浏览器安装:${{ steps.browser.outcome }}" "全链路检查:${{ steps.stack.outcome }}" "受控上游浏览器:${{ steps.web-stub.outcome }}"; do
            name="${pair%%:*}"
            outcome="${pair#*:}"
            if [ "$outcome" != "success" ]; then
              failed="${failed} ${name}(${outcome})"
            fi
          done
          if [ -n "${failed}" ]; then
            echo "以下检查未通过：${failed}"
            echo "缺服务或行为不符契约都算未通过；失败块（requestId/步骤/期望/实际/退出码）见上面各步骤输出与 stack-evidence 工件。"
            echo "转交：java_* → B；api_* / planning_* → C；web_* → E；harness 自身 → D。"
            exit 1
          fi
          echo "全链路检查通过。"

      - name: 收尾：兜底停止可能残留的服务（check_all 正常跑完会自己 --stop）
        if: always()
        run: |
          python integration/start_stack.py --stop || true
          pkill -f "uvicorn agent_runtime" || true
          pkill -f "vite" || true
