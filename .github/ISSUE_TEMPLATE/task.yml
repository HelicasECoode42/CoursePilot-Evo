name: 开发任务
description: 一项可验收的业务交付；点开再写实施细节
title: "[任务] "
body:
  - type: markdown
    attributes:
      value: "先阅读 docs/18-team-progress-guide.md。创建后加入 Project，填写周次、模块、优先级、Assignees 和计划复核人。草案不要当成已派发任务。"
  - type: textarea
    id: outcome
    attributes:
      label: 交付结果与范围
      description: 标题写用户/队友获得的能力。先说明完成后能做什么、对应模块功能编号、本次范围和交接；实现步骤放下面。
      value: "完成后能做什么：\n\n模块功能编号与文档：\n\n本次主要做什么：\n\n交给谁／相邻责任："
    validations:
      required: true
  - type: textarea
    id: contract
    attributes:
      label: 开发参考：输入输出、接口与实现建议
      description: 写输入来自谁、输出交给谁、准确接口/对象、TRD 和 Schema 链接；不能只写“接通后端”。
    validations:
      required: true
  - type: textarea
    id: dependencies
    attributes:
      label: 依赖与计划复核人
      description: 引用依赖 Issue，填写模块角色或已确认 GitHub 账号；无依赖写无。
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: 验收条件
      description: 写可操作检查，至少包括正常、异常和适用的 UNKNOWN/权限边界。
      value: "- [ ] 正常场景：\n- [ ] 异常/未知场景：\n- [ ] 关联模块实际调用：\n- [ ] 启动与检查证据："
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: 交付证据（开发后补充）
      description: PR、检查命令与结果、截图/最小复现、未完成限制。禁止敏感原始数据。
