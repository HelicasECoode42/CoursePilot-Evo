<style>

adding:15px 17px;min-height:77px;display:flex;align-items:center;gap:12px;transition:border-color .12s,background-color .12s}.option:hover{border-color:#91b59f;background:#fbfdfb}.option[aria-pressed=true]{border-color:var(--green);background:var(--wash)}.option strong{display:block;font-size:16px;font-weight:550;margin-bottom:4px}.option small{display:block;color:var(--soft);font-size:12px;line-height:1.5}.selection{border:1px solid #cbd6ce;border-radius:50%;width:19px;height:19px;flex:none}.option[aria-pressed=true] .selection{background:var(--green);border-color:var(--green);position:relative}.option[aria-pressed=true] .selection:after{content:'✓';color:white;position:absolute;font-size:12px;top:0;left:4px}.controls{display:flex;justify-content:space-between;align-items:center;gap:15px;margin-top:27px;padding-top:20px}.next{background:var(--green);border:0;color:white;font-weight:550;padding:13px 25px;border-radius:9px;min-width:125px}.next:hover{background:#18543d}.back,.textbutton{border:0;background:transparent;color:var(--soft);padding:12px 0;font-size:14px}.back:hover,.textbutton:hover{color:var(--green)}.back:disabled{visibility:hidden}.helper{margin:0;min-height:23px;font-size:13px;color:#8b4b24}.route-note{font-size:12px;color:var(--soft);margin:13px 0 0}.wide .option{min-height:75px}.teachlist{display:grid;gap:10px}.teacher{display:flex;align-items:center;gap:14px;border:1px solid var(--line);padding:14px 16px;border-radius:11px}.teacher.selected{border-color:var(--green);background:var(--wash)}.teacher .teacherbody{flex:1;min-width:0}.teacher strong{font-size:15px;font-weight:550}.teacher p{margin:4px 0 0;font-size:12px;color:var(--soft)}.linkbtn{border:0;background:none;color:var(--green);font-size:12px;padding:8px}.pick{border:1px solid #b9cbc0;background:white;border-radius:6px;padding:7px 12px;font-size:12px;white-space:nowrap}.selected .pick{background:var(--green);color:white;border-color:var(--green)}.field{margin:16px 0}.field label{display:block;font-size:13px;color:var(--soft);margin-bottom:8px}input[type=search],input[type=text],select{width:100%;border:1px solid #cbd7ce;border-radius:9px;padding:12px 14px;background:white;color:var(--ink)}.seg{display:flex;gap:8px;flex-wrap:wrap;margin:18px 0}.seg button{border:1px solid var(--line);padding:10px 13px;background:white;border-radius:7px;font-size:13px}.seg button[aria-pressed=true]{background:var(--wash);color:var(--green);border-color:var(--green)}.hint{background:#f8faf8;border-radius:9px;padding:13px 15px;color:var(--soft);font-size:13px;line-height:1.65;margin-top:18px}.hint.amber{background:#fff8ed;color:#875817}.summaryrow{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:22px}.pill{background:var(--wash);border-radius:6px;padding:6px 9px;font-size:12px;color:var(--green)}.candidate{border-top:1px solid var(--line);padding:18px 0;display:grid;grid-template-columns:1fr auto;gap:10px}.candidate strong{font-size:17px;font-weight:550}.candidate .meta{font-size:13px;color:var(--soft);margin:6px 0}.candidate .reason{font-size:13px;margin:10px 0 0;line-height:1.7}.pending{font-size:12px;color:#936329;background:#fff5e5;padding:6px 8px;border-radius:5px;height:fit-content}.footer{max-width:640px;margin:25px auto 30px;text-align:center;font-size:11px;color:#6d7a73;padding:0 20px}.detail[hidden]{display:none}.detail{position:fixed;inset:0;background:#17302650;z-index:10;display:flex;align-items:center;justify-content:center;padding:22px}.sheet{width:min(520px,100%);max-height:85dvh;overflow:auto;overscroll-behavior:contain;background:white;border-radius:16px;padding:27px;box-shadow:0 25px 80px #0d261e30}.sheethead{display:flex;justify-content:space-between;align-items:flex-start;gap:20px}.close{border:0;background:#f2f5f3;padding:8px 13px;border-radius:7px;font-size:13px}.detail p{font-size:14px;color:var(--soft)}.datarow{border-top:1px solid var(--line);padding:13px 0;font-size:14px;display:flex;justify-content:space-between;gap:20px}.datarow small{color:var(--soft)}.evidence{border-left:2px solid #c8d9ce;padding-left:13px;margin:16px 0}.evidence p{font-size:13px}.detail h3{font-size:15px;font-weight:600;margin-top:22px}.profileFoot{font-size:12px;color:#926c38!important}.dirline{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-top:18px;color:var(--soft);font-size:12px}.dirline button{padding:4px}.timeOptions{grid-template-columns:repeat(3,1fr)}.timeOptions .option{min-height:62px;justify-content:center;padding:12px}.timeOptions .option strong{margin:0;font-size:14px}.timeOptions .selection{width:15px;height:15px}.timeOptions .option[aria-pressed=true] .selection:after{font-size:10px;left:2px;top:-1px}@media(max-width:540px){.bar{padding:0 20px;height:67px}.brand{font-size:18px}.brand .small{display:none}main{margin-top:22px;min-height:0}h1{font-size:28px}.intro{font-size:13px;margin-bottom:20px}.option{padding:12px;min-height:83px;gap:8px}.option strong{font-size:14px}.option small{font-size:11px}.selection{width:17px;height:17px}.option[aria-pressed=true] .selection:after{left:3px;top:-1px}.controls{margin-top:20px}.teacher{padding:12px;gap:6px}.teacher strong{font-size:13px}.teacher .linkbtn{padding:6px;font-size:11px}.candidate{grid-template-columns:1fr}.candidate .pending{width:fit-content}.timeOptions{grid-template-columns:repeat(2,1fr)}.sheet{padding:22px}.footer{margin-top:20px}}@media(prefers-reduced-motion:reduce){*{transition:none!important}}

<body>
<a class="skip" href="#question">跳到当前问题</a>
<header class="bar"><div class="brand"><span class="mark" aria-hidden="true"></span>CoursePilot <span class="small">交互示例</span></div><button class="record" id="recordBtn" type="button">我的学业记录</button></header>
<main id="main"><div class="progress"><span id="phase">这学期的想法</span><div class="track" aria-hidden="true"><span id="progressFill"></span></div></div><section id="screen" aria-labelledby="question"></section><p id="feedback" class="helper" role="status" aria-live="polite"></p><nav class="controls" aria-label="问题导航"><button class="back" id="back" type="button">返回上一页</button><button class="next" id="next" type="button">选好了，下一步</button></nav></main>
<footer class="footer">课程、教师、评价和学业记录均为演示占位；不会实际选课。</footer>
<div class="detail" id="detail" hidden><section class="sheet" role="dialog" aria-modal="true" aria-labelledby="detailTitle"><div class="sheethead"><h2 id="detailTitle"></h2><button type="button" class="close" id="close">关闭</button></div><div id="detailBody"></div></section></div>
<script>
'use strict';
const $=id=>document.getElementById(id);
const motives=[['gpa','想拿高绩点','看给分反馈和考核方式'],['easy','想轻松一点','少签到、少作业或少汇报'],['reviews','想上评价好的课','讲得清楚，体验也好'],['teacher','想上某位老师的课','有特别想选的老师或课程'],['interest','想学点感兴趣的','探索新主题，不急着定方向'],['career','为未来工作做准备','先了解方向，再找相关课程'],['study','为升学打好基础','补基础，兼顾成绩与训练'],['time','想要合适的课表','留出实习、自习和生活时间']];
const preferences=[['grading','给分反馈较友好','仍需结合个人投入'],['attendance','尽量少签到','看考勤要求和近期反馈'],['homework','作业量少一些','不想每周投入太多'],['group','少小组任务','减少组队的不确定性'],['presentation','少汇报和展示','不想频繁做 pre'],['exam','尽量避开闭卷','更愿意报告或项目考核']];
const directions={
'计算机科学与技术':[['backend','后端与业务系统','做接口、处理数据、维护服务','常见工作是把业务需求做成稳定的服务和接口。可关注数据库、系统、网络等课程主题；是否有对应课程仍需查本校大纲。'],['web','Web 与交互开发','把需求变成可操作的网页','常见工作是实现页面和交互，处理不同设备上的体验。可探索 Web、软件工程和人机交互主题。'],['data','数据分析与 BI','用数据回答问题、做报表','常见工作涉及数据查询、指标分析与可视化。可探索统计、数据库和数据分析主题。'],['ai','算法与 AI','训练和评估模型解决任务','任务可能涉及推荐、识别和生成。通常要补数学、算法与实验能力；课程选择还要结合已有基础。']],
'自动化与电气':[['control','控制与自动化','编程控制设备，做调试','常见任务包括控制程序、设备配置和现场调试。可探索控制原理、电路、PLC 与实验主题。'],['embedded','嵌入式与软件控制','让软件与硬件配合工作','可探索程序设计、电子电路和系统实验。这里仅为方向示例，尚未核验该专业培养方案。']],
'机械类':[['mechanical','结构与机械设计','做结构方案、三维图与工程图','常见任务涉及结构设计、制图及制造验证。可探索机械设计、制图、材料与工艺主题。'],['manufacturing','制造与工艺','了解产品怎样被制造出来','可探索制造方法、材料与工艺主题。这里仅为方向示例，尚未核验该专业培养方案。']],
'经管与财会':[['business','商业分析与运营','分析市场和用户，评估方案','可探索统计、市场研究和运营分析主题。岗位不只看工具，还需要理解业务问题。'],['accounting','会计与审计','理解账务报表，完成核查','可探索会计、审计、税务与法规主题。方向示例不代表已接入该专业教学计划。']]
};
const courseRows=[{id:'a',name:'示例数据库课程',teacher:'示例教师甲',summary:'有往年给分与作业反馈',review:'示例评价：作业频率较低，评分说明比较清楚。',caveat:'未提供本学期考勤要求；不能判断是否签到。',tags:['作业量反馈','评分规则反馈']},{id:'b',name:'示例系统课程',teacher:'示例教师乙',summary:'有往年授课与项目反馈',review:'示例评价：讲解较细，课程项目需要持续投入。',caveat:'工作量与投入因人而异；没有可信成绩统计。',tags:['授课体验反馈','项目训练反馈']}];
const state={motives:[],preferences:[],career:[],interest:'',pinned:null,pinMode:'prefer',slots:[],timeMode:'hard',major:'计算机科学与技术',route:['goals'],index:0};
const escape=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function toggle(arr,v){const i=arr.indexOf(v);if(i<0)arr.push(v);else arr.splice(i,1)}
function options(items,group){return `<div class="options">${items.map(([v,label,desc])=>`<button class="option" type="button" data-group="${group}" data-value="${escape(v)}" aria-pressed="${state[group].includes(v)}"><span class="selection" aria-hidden="true"></span><span><strong>${escape(label)}</strong><small>${escape(desc)}</small></span></button>`).join('')}</div>`}
function title(q,desc){return `<h1 id="question" tabindex="-1">${q}</h1><p class="intro">${desc}</p>`}
function rebuildRoute(){state.route=['goals'];if(state.motives.some(x=>['gpa','easy','reviews','study'].includes(x)))state.route.push('preferences');if(state.motives.includes('career'))state.route.push('career');if(state.motives.includes('interest'))state.route.push('interest');state.route.push('teachers','time','result')}
function render(moveFocus=true){const page=state.route[state.index];$('feedback').textContent='';$('back').disabled=state.index===0;$('next').textContent=page==='result'?'重新调整条件':'选好了，下一步';$('phase').textContent=({goals:'这学期的想法',preferences:'上课与考核偏好',career:'了解发展方向',interest:'想探索的主题',teachers:'想上的课程和老师',time:'你的时间安排',result:'课程候选'})[page];$('progressFill').style.width=`${(state.index+1)/state.route.length*100}%`;let html='';
if(page==='goals')html=title('这学期选课，你最在意什么？','可以同时选几个。后面只问与你有关的问题。')+options(motives,'motives');
if(page==='preferences')html=title('什么样的课，更适合你这学期？','这些偏好可以同时存在，也可以都不选。')+options(preferences,'preferences');
if(page==='career'){const list=directions[state.major];html=title('哪个方向，你想多了解一点？',`按${escape(state.major)}展示。选一个或多个，也可以暂时不决定。`)+options(list.map(x=>x.slice(0,3)),'career')+`<div class="dirline"><span>先看工作做什么，再判断自己是否感兴趣。</span><button class="linkbtn" type="button" data-action="direction">看方向介绍</button></div>`;}
if(page==='interest')html=title('有什么主题，让你想试试看？','兴趣探索也可以只是这学期的一次尝试。')+`<div class="field"><label for="interest">想学的主题</label><input type="text" id="interest" name="interest" autocomplete="off" value="${escape(state.interest)}" placeholder="例如：摄影、心理学、人工智能、文学…"></div><p class="route-note">没有具体想法也可以跳过，先看看有评价和内容介绍的课程。</p>`;
if(page==='teachers')html=title('有特别想上的课程或老师吗？','选择具体的课程与老师；没有的话，直接下一步。')+`<div class="field"><label class="sr" for="courseSearch">搜索课程或教师</label><input type="search" id="courseSearch" name="courseSearch" autocomplete="off" placeholder="搜索课程或老师（目前仅示例）…"></div><div class="teachlist" id="teacherList">${teachersHTML(courseRows)}</div><div class="seg" aria-label="指定教师的优先级"><button type="button" data-pinmode="prefer" aria-pressed="${state.pinMode==='prefer'}">优先考虑，可协商</button><button type="button" data-pinmode="must" aria-pressed="${state.pinMode==='must'}">必须保留这个老师和课</button></div>`;
if(page==='time')html=title('哪些时间，你希望不排课？','先选时段，再决定这是底线还是偏好。')+`<div class="options timeOptions">${['周一','周二','周三','周四','周五','早八'].map(v=>`<button type="button" class="option" data-group="slots" data-value="${v}" aria-pressed="${state.slots.includes(v)}"><span class="selection" aria-hidden="true"></span><strong>${v}</strong></button>`).join('')}</div><div class="seg" aria-label="时间要求的强度"><button type="button" data-timemode="hard" aria-pressed="${state.timeMode==='hard'}">这些时间必须空出来</button><button type="button" data-timemode="soft" aria-pressed="${state.timeMode==='soft'}">尽量避开，可以商量</button></div><p class="route-note">正式产品可以细选星期、节次和周次；这里只演示选择方式。</p>`;
if(page==='result'){const selected=motives.filter(x=>state.motives.includes(x[0])).map(x=>x[1]);html=title('先看看这些课程和老师','示例候选展示了比较方式；真实课程匹配尚未接入。')+`<div class="summaryrow">${selected.map(x=>`<span class="pill">${escape(x)}</span>`).join('')}${state.slots.length?`<span class="pill">${escape(state.slots.join('、'))}${state.timeMode==='hard'?'必须空出':'尽量空出'}</span>`:''}</div><div class="hint amber">本学期上课时间尚未取得。现在可以保存课程意愿，暂时不能确认课表无冲突。</div>${courseRows.map(x=>`<article class="candidate"><div><strong>${x.name}</strong><p class="meta">${x.teacher} · 示范课程与教师</p><p class="reason">${escape(x.summary)}。与你的目标是否匹配，需要真实课程和评价资料核对。</p><button class="linkbtn" type="button" data-review="${x.id}">看课程与教师评价</button></div><span class="pending">时间待确认</span></article>`).join('')}<p class="route-note">未完成的必修要求与建议修读清单会从你的学业记录生成；当前仅为占位，未计算真实学分缺口。</p>`;}
$('screen').innerHTML=html;if(moveFocus)$('question').focus({preventScroll:true});window.scrollTo(0,0);}
function teachersHTML(rows){return rows.length?rows.map(x=>`<article class="teacher ${state.pinned===x.id?'selected':''}"><div class="teacherbody"><strong>${x.name} · ${x.teacher}</strong><p>${x.summary}（示例）</p></div><button class="linkbtn" type="button" data-review="${x.id}">评价</button><button class="pick" type="button" data-pin="${x.id}" aria-pressed="${state.pinned===x.id}">${state.pinned===x.id?'已选':'想上'}</button></article>`).join(''):'<p class="intro">示例库里没有这个课程或老师。正式产品会从已导入资料检索。</p>'}
let focusBeforeDialog=null;
function openDetail(titleText,body){focusBeforeDialog=document.activeElement;$('detailTitle').textContent=titleText;$('detailBody').innerHTML=body;$('detail').hidden=false;$('main').inert=true;document.querySelector('.bar').inert=true;$('close').focus()}
function closeDetail(){$('detail').hidden=true;$('main').inert=false;document.querySelector('.bar').inert=false;focusBeforeDialog?.focus()}
function review(id){const c=courseRows.find(x=>x.id===id);openDetail(c.name+' · '+c.teacher,`<p class="profileFoot">以下均为虚构示例评价，未接入本校评价网站。</p><h3>上课体验</h3><div class="evidence"><p>${c.review}</p><p class="small">来源：演示评价文档 · 修读学期：示例往年 · 1 条示例</p></div><h3>签到、给分与考核</h3><p>${c.caveat}</p><h3>学分、先修与开课时间</h3><p>真实大纲、学分和本学期班次待导入；不能依靠评价文字推断课程时间。</p><button class="next" type="button" data-dialogpin="${id}">${state.pinned===id?'取消这项意愿':'想上这位老师的这门课'}</button>`)}
$('recordBtn').onclick=()=>openDetail('你的学业记录',`<p class="profileFoot">这里展示已导入资料的入口，当前没有真实学生数据。</p><div class="field"><label for="major">专业（演示切换）</label><select id="major" name="major">${Object.keys(directions).map(x=>`<option ${state.major===x?'selected':''}>${x}</option>`).join('')}</select></div><div class="datarow"><span>已修课程</span><small>待导入记录</small></div><div class="datarow"><span>未完成的必修要求</span><small>待教学计划核对</small></div><div class="datarow"><span>各类学分缺口</span><small>待记录完整后计算</small></div><p>正式使用时，这些信息来自已关联记录。你只需核对、纠错或补充缺失内容。</p>`);
$('detailBody').addEventListener('change',e=>{if(e.target.id==='major'){state.major=e.target.value;state.career=[];}});
$('close').onclick=()=>{closeDetail();render(false)};
$('detail').addEventListener('click',e=>{if(e.target===$('detail')){closeDetail();render(false)}const pin=e.target.closest('[data-dialogpin]');if(pin){state.pinned=state.pinned===pin.dataset.dialogpin?null:pin.dataset.dialogpin;closeDetail();render(false)}});
$('detail').addEventListener('keydown',e=>{if(e.key==='Escape'){closeDetail();render(false)}if(e.key==='Tab'){const all=[...$('detail').querySelectorAll('button,input,select,a[href]')].filter(x=>!x.disabled);if(e.shiftKey&&document.activeElement===all[0]){e.preventDefault();all.at(-1).focus()}else if(!e.shiftKey&&document.activeElement===all.at(-1)){e.preventDefault();all[0].focus()}}});
$('screen').addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;if(b.dataset.group){toggle(state[b.dataset.group],b.dataset.value);b.setAttribute('aria-pressed',String(state[b.dataset.group].includes(b.dataset.value)));$('feedback').textContent='';}
if(b.dataset.pin){state.pinned=state.pinned===b.dataset.pin?null:b.dataset.pin;$('teacherList').innerHTML=teachersHTML(courseRows);}
if(b.dataset.pinmode){state.pinMode=b.dataset.pinmode;document.querySelectorAll('[data-pinmode]').forEach(x=>x.setAttribute('aria-pressed',String(x.dataset.pinmode===state.pinMode)))}
if(b.dataset.timemode){state.timeMode=b.dataset.timemode;document.querySelectorAll('[data-timemode]').forEach(x=>x.setAttribute('aria-pressed',String(x.dataset.timemode===state.timeMode)))}
if(b.dataset.review)review(b.dataset.review);
if(b.dataset.action==='direction')openDetail('这些方向通常在做什么？',directions[state.major].map(x=>`<h3>${x[1]}</h3><p>${x[3]}</p>`).join('')+'<p class="profileFoot">根据公开招聘任务整理的介绍；课程主题是待本校大纲核对的建议。来源列表见配套需求研究文档。</p>');});
$('screen').addEventListener('input',e=>{if(e.target.id==='interest')state.interest=e.target.value;if(e.target.id==='courseSearch'){const s=e.target.value.trim();$('teacherList').innerHTML=teachersHTML(courseRows.filter(x=>(x.name+x.teacher).includes(s)))}});
$('next').onclick=()=>{const page=state.route[state.index];if(page==='goals'){if(!state.motives.length){$('feedback').textContent='先选一项，或者选“想要合适的课表”开始。';return}rebuildRoute()}if(page==='result'){state.index=0;render();return}state.index=Math.min(state.index+1,state.route.length-1);render()};
$('back').onclick=()=>{state.index=Math.max(0,state.index-1);render()};
render(false);
</script>
</body>
</html>
