# Registered Java tools the model may call, with per-run call caps.
# The hard cap is enforced by the runner budget (maxToolCalls=6); per-tool caps
# must never exceed it.
tools:
  - name: getSchoolProgress
    max_calls: 1
  - name: getAcademicRecord
    max_calls: 1
  - name: auditRequirements
    max_calls: 1
  - name: listCourses
    max_calls: 2
  - name: listTeacherCourseOptions
    max_calls: 2
  - name: searchReviews
    max_calls: 2
  # Section assignment: one listOfferings per planned course. Not counted in the
  # 6-call run budget; capped by Budget.max_offering_calls (4).
  - name: listOfferings
    max_calls: 4
  - name: listCareerDirections
    max_calls: 1
  - name: validatePlan
    max_calls: 2
  - name: listOfferingSnapshots
    max_calls: 1
