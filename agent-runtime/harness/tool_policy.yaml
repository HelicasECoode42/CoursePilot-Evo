# Registered Java tools the model may call, with per-run call caps.
# The hard cap is enforced by the runner budget (maxToolCalls=6); per-tool caps
# must never exceed it.
tools:
  - name: getSchoolProgress
    max_calls: 1
  - name: getAcademicRecord
    max_calls: 1
  - name: auditRequirements
    max_calls: 1
  - name: listCourses
    max_calls: 2
  - name: listTeacherCourseOptions
    max_calls: 2
  # Review lookups: one searchReviews per course, not counted in the 6-call run
  # budget; capped by Budget.max_review_calls (8). Must not exceed that value.
  - name: searchReviews
    max_calls: 8
  # Offered-this-term check plus section assignment: one unfiltered page and one call
  # per candidate course (precheck, capped by Budget.max_offering_precheck_calls=10),
  # then one call per model-picked course. Not counted in the 6-call run budget; the
  # total is capped by Budget.max_offering_calls (16). Must not exceed that value.
  - name: listOfferings
    max_calls: 16
  - name: listCareerDirections
    max_calls: 1
  - name: validatePlan
    max_calls: 2
  - name: listOfferingSnapshots
    max_calls: 1
