# 测试专用数据源：内存库，不碰 ./data/coursepilot 这个开发用文件库。
#
# 为什么必须覆盖：主配置用的是 jdbc:h2:file:./data/coursepilot;DB_CLOSE_DELAY=-1。
# 两个后果都真实出现过：
#   1. Spring 会缓存多个不同配置的 ApplicationContext，每个都持有自己的
#      DataSource 指向同一个文件。DB_CLOSE_DELAY=-1 让第一个上下文一直占着
#      文件锁，第二个上下文启动时报 MVStoreException: The file is locked，
#      整个测试类全部 Error（2026-10-29 实测 AuditResultAssemblerTest 19 个）。
#   2. 测试会直接写进开发库，污染已导入的真实培养方案数据。
spring.datasource.url=jdbc:h2:mem:coursepilot-test;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=update
