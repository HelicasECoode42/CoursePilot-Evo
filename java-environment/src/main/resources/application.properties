server.port=8081
# 默认只绑 loopback；需要局域网访问时显式设 COURSEPILOT_BIND_ADDRESS（不要默认 0.0.0.0）。
server.address=${COURSEPILOT_BIND_ADDRESS:127.0.0.1}
# Tomcat 层兜底：拒绝后吞掉的请求体上限，以及 x-www-form-urlencoded 表单上限。
# JSON 体积由 RequestSizeLimitFilter 按 coursepilot.max-json-body-bytes 限制（默认 2 MiB）。
server.tomcat.max-swallow-size=2MB
server.tomcat.max-http-form-post-size=1MB
coursepilot.max-json-body-bytes=${COURSEPILOT_MAX_JSON_BODY_BYTES:2097152}

spring.datasource.url=jdbc:h2:file:./data/coursepilot;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.show-sql=false

# H2 控制台关闭：它在同一个端口上提供免认证的任意 SQL 执行，等于绕过
# 对象级授权直接读整张成绩表（docs/04：不能把本地默认配置开放公网）。
# 本地排查时用 -Dspring.h2.console.enabled=true 临时打开，不要写回仓库。
spring.h2.console.enabled=false

# 服务密钥只从环境变量来，仓库里不放默认值（docs/04）。没配时
# ServiceKeyFilter 会让 /api/v1 一律以 503 拒服务，而不是默认放行。
coursepilot.service-key=${COURSEPILOT_SERVICE_KEY:}

# Synthetic curriculum uploads are available only when explicitly enabled for a local demo.
coursepilot.admin-key=${COURSEPILOT_ADMIN_KEY:}
coursepilot.import.synthetic.enabled=${COURSEPILOT_SYNTHETIC_IMPORT_ENABLED:false}

# Leave room for multipart framing while keeping the XLSX part bounded to 10 MiB in code.
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=11MB
