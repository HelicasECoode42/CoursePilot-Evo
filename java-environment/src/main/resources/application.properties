server.port=8081

spring.datasource.url=jdbc:h2:file:./data/coursepilot;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.show-sql=false

# H2 控制台关闭：它在同一个端口上提供免认证的任意 SQL 执行，等于绕过
# 对象级授权直接读整张成绩表（docs/04：不能把本地默认配置开放公网）。
# 本地排查时用 -Dspring.h2.console.enabled=true 临时打开，不要写回仓库。
spring.h2.console.enabled=false

# 服务密钥只从环境变量来，仓库里不放默认值（docs/04）。没配时
# ServiceKeyFilter 会让 /api/v1 一律以 503 拒服务，而不是默认放行。
coursepilot.service-key=${COURSEPILOT_SERVICE_KEY:}
